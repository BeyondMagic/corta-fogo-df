services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corta-fogo-df}
      POSTGRES_USER: ${POSTGRES_USER:-corta-fogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-corta-fogo-df}
      -user=${POSTGRES_USER:-corta-fogo}
      -password=${POSTGRES_PASSWORD:-corta-fogo}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate info

  load:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts/carga:/scripts:ro
      - ./data/processed:/data/processed:ro
    entrypoint: >
      psql -h db -U ${POSTGRES_USER:-corta-fogo} -d ${POSTGRES_DB:-corta-fogo-df}
      -v ON_ERROR_STOP=1 -f /scripts/carregar_focos.sql

  load_camadas:
    build:
      context: ./src/pipeline
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./data/raw:/app/data/raw

  refresh_gold:
    image: postgres:16-alpine
    depends_on:
      load:
        condition: service_completed_successfully
      load_camadas:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts/carga:/scripts:ro
    entrypoint: >
      psql -h db -U ${POSTGRES_USER:-corta-fogo} -d ${POSTGRES_DB:-corta-fogo-df}
      -v ON_ERROR_STOP=1 -f /scripts/refresh_gold.sql

volumes:
  pgdata:


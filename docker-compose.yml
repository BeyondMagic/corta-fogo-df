services:
  db:
    image: postgis/postgis:16-3.4
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corta-fogo-df}
      POSTGRES_USER: ${POSTGRES_USER:-corta-fogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SHOW wal_level' | grep -qx logical"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-corta-fogo-df}
      -user=${POSTGRES_USER:-corta-fogo}
      -password=${POSTGRES_PASSWORD:-corta-fogo}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate info

  load:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts/carga:/scripts:ro
      - ./data/processed:/data/processed:ro
    entrypoint: >
      psql -h db -U ${POSTGRES_USER:-corta-fogo} -d ${POSTGRES_DB:-corta-fogo-df}
      -v ON_ERROR_STOP=1 -f /scripts/carregar_focos.sql

  load_camadas:
    build:
      context: ./src/pipeline
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./data/raw:/app/data/raw

  refresh_gold:
    image: postgres:16-alpine
    depends_on:
      load:
        condition: service_completed_successfully
      load_camadas:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts/carga:/scripts:ro
    entrypoint: >
      psql -h db -U ${POSTGRES_USER:-corta-fogo} -d ${POSTGRES_DB:-corta-fogo-df}
      -v ON_ERROR_STOP=1 -f /scripts/refresh_gold.sql

  batch_ingest:
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python batch_ingest.py
    restart: on-failure:3
    volumes:
      - ./data/processed:/app/data/processed:ro
      - lakehouse:/app/data/delta

  cdc_consumer:
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python cdc_consumer.py
    restart: on-failure
    depends_on:
      load_camadas:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - lakehouse:/app/data/delta

  verificar_lakehouse:
    profiles: ["verificacao"]
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python scripts/verificar_lakehouse.py
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - lakehouse:/app/data/delta:ro
      - ./scripts:/app/scripts:ro

  demo_reentrega:
    profiles: ["demonstracao"]
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python scripts/testes/demo_reentrega_cdc.py
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts:/app/scripts:ro

volumes:
  pgdata:
  lakehouse:


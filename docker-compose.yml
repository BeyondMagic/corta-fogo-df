x-dagster: &dagster
  profiles: ["orquestracao"]
  build:
    context: ./orquestracao
  depends_on:
    db:
      condition: service_healthy
  environment:
    DB_HOST: db
    DB_PORT: 5432
    DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
    DB_USER: ${POSTGRES_USER:-corta-fogo}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    DELTA_DIR: /app/data/delta
    DUCKDB_PATH: /app/data/warehouse/corta_fogo.duckdb
    DBT_PROJECT_DIR: /app/transformacao
    PIPELINE_DIR: /app/src/pipeline
    CSV_FOCOS: /app/data/processed/focos_df_2015_2025.csv
    FALHAS_INDUZIDAS: ${FALHAS_INDUZIDAS:-0}
  volumes:
    - lakehouse:/app/data/delta
    - warehouse:/app/data/warehouse
    - dagster_state:/opt/dagster/storage
    - ./transformacao:/app/transformacao
    - ./src/pipeline:/app/src/pipeline:ro
    - ./data/processed:/app/data/processed:ro

services:
  db:
    image: postgis/postgis:16-3.4
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corta-fogo-df}
      POSTGRES_USER: ${POSTGRES_USER:-corta-fogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SHOW wal_level' | grep -qx logical"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    command: >
      -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-corta-fogo-df}
      -user=${POSTGRES_USER:-corta-fogo}
      -password=${POSTGRES_PASSWORD:-corta-fogo}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate info

  load:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts/carga:/scripts:ro
      - ./data/processed:/data/processed:ro
    entrypoint: >
      psql -h db -U ${POSTGRES_USER:-corta-fogo} -d ${POSTGRES_DB:-corta-fogo-df}
      -v ON_ERROR_STOP=1 -f /scripts/carregar_focos.sql

  load_camadas:
    build:
      context: ./src/pipeline
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./data/raw:/app/data/raw

  refresh_gold:
    image: postgres:16-alpine
    depends_on:
      load:
        condition: service_completed_successfully
      load_camadas:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts/carga:/scripts:ro
    entrypoint: >
      psql -h db -U ${POSTGRES_USER:-corta-fogo} -d ${POSTGRES_DB:-corta-fogo-df}
      -v ON_ERROR_STOP=1 -f /scripts/refresh_gold.sql

  batch_ingest:
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python batch_ingest.py
    restart: on-failure:3
    volumes:
      - ./data/processed:/app/data/processed:ro
      - lakehouse:/app/data/delta

  cdc_consumer:
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python cdc_consumer.py
    restart: on-failure
    depends_on:
      load_camadas:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - lakehouse:/app/data/delta

  verificar_lakehouse:
    profiles: ["verificacao"]
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python scripts/verificar_lakehouse.py
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - lakehouse:/app/data/delta:ro
      - ./scripts:/app/scripts:ro

  demo_reentrega:
    profiles: ["demonstracao"]
    build:
      context: ./src/pipeline
      dockerfile: Dockerfile.lakehouse
    command: python scripts/testes/demo_reentrega_cdc.py
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
    volumes:
      - ./scripts:/app/scripts:ro

  dbt:
    profiles: ["transformacao"]
    build:
      context: ./transformacao
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-corta-fogo-df}
      DB_USER: ${POSTGRES_USER:-corta-fogo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-corta-fogo}
      DELTA_DIR: /app/data/delta
      DUCKDB_PATH: /app/data/warehouse/corta_fogo.duckdb
    volumes:
      - lakehouse:/app/data/delta:ro
      - warehouse:/app/data/warehouse

  dagster_webserver:
    <<: *dagster
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/home/workspace.yaml
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # O daemon sobe depois do webserver: os dois criam o SQLite do Dagster na primeira
  # execucao, e a criacao simultanea deixa o alembic_version com dois heads (nenhum
  # asset carrega).
  dagster_daemon:
    <<: *dagster
    command: dagster-daemon run -w /opt/dagster/home/workspace.yaml
    depends_on:
      db:
        condition: service_healthy
      dagster_webserver:
        condition: service_healthy

volumes:
  pgdata:
  lakehouse:
  warehouse:
  dagster_state:


name: corta_fogo_df
version: "1.0.0"
config-version: 2

profile: corta_fogo_df

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raio_uc_m: 1000
  fuso_local: "America/Sao_Paulo"
  # Abertura e fechamento da validade das versoes extremas de dim_imovel_car (SCD Tipo 2).
  inicio_vigencia_aberta: "1900-01-01 00:00:00+00"
  fim_vigencia_aberta: "9999-12-31 00:00:00+00"
  # Foco ou imovel fora de todas as RAs (borda do DF): vale a RA mais proxima ate esta distancia.
  tolerancia_ra_m: 2000
  # Indice de Prioridade de Vistoria (ADR 0005). Os pesos somam 1 e sao uma escolha de
  # valor do grupo, nao um resultado estatistico.
  ano_inicio_serie: 2015
  ano_fim_serie: 2025
  anos_minimos_reincidencia: 2
  peso_recorrencia: 0.4
  peso_recencia: 0.3
  peso_intensidade: 0.3
  # Piso da area no calculo da densidade: pixel nominal do VIIRS 375 m (14,1 ha).
  area_minima_ha: 14.1

models:
  corta_fogo_df:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: gold

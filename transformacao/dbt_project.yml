name: corta_fogo_df
version: "1.0.0"
config-version: 2

profile: corta_fogo_df

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  raio_uc_m: 1000
  fuso_local: "America/Sao_Paulo"
  # Abertura e fechamento da validade das versoes extremas de dim_imovel_car (SCD Tipo 2).
  inicio_vigencia_aberta: "1900-01-01 00:00:00+00"
  fim_vigencia_aberta: "9999-12-31 00:00:00+00"

models:
  corta_fogo_df:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: gold
